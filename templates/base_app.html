{% extends "base.html" %}
{% block content %}

<div class="max-w-md mx-auto min-h-screen flex flex-col pb-10">

  <div class="sticky top-0 z-30">
    <header class="topbar flex items-center justify-between px-5 py-3.5">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-lg flex items-center justify-center" style="background:linear-gradient(135deg, var(--accent-turf), var(--accent-turf-dim));">
          <span class="font-display font-700 text-sm text-[#04160B]">P</span>
        </div>
        <span class="font-display font-700 text-base tracking-wide">PELADA<span style="color:var(--accent-turf)">STATS</span></span>
      </div>
      <div class="flex items-center gap-2.5">
        <span class="text-xs font-600" style="color:var(--text-muted)">{{ current_user.nickname }}</span>
        <a href="{{ url_for('auth.logout') }}" style="color:var(--accent-danger)" title="Sair" aria-label="Sair">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path>
            <line x1="12" y1="2" x2="12" y2="12"></line>
          </svg>
        </a>
      </div>
    </header>

    <div class="tabbar-wrap">
      <nav class="tabbar">
        <a href="{{ url_for('dashboard.home') }}" class="tabbar-link {{ 'active' if request.endpoint == 'dashboard.home' }}">Dashboard</a>
        <a href="{{ url_for('matches.lista') }}" class="tabbar-link {{ 'active' if request.endpoint and request.endpoint.startswith('matches.') }}">Jogos</a>
        <a href="{{ url_for('profile.me') }}" class="tabbar-link {{ 'active' if request.endpoint and request.endpoint.startswith('profile.') }}">Perfil</a>
        <a href="{{ url_for('records.lista') }}" class="tabbar-link {{ 'active' if request.endpoint == 'records.lista' }}">Recordes</a>
        <a href="{{ url_for('comparar.head_to_head') }}" class="tabbar-link {{ 'active' if request.endpoint == 'comparar.head_to_head' }}">Comparar</a>
        <a href="{{ url_for('settings.definicoes') }}" class="tabbar-link {{ 'active' if request.endpoint == 'settings.definicoes' }}">Definições</a>
      </nav>
    </div>
  </div>

  <main class="flex-1">
    {% block app_content %}{% endblock %}
  </main>

</div>

{% endblock %}
