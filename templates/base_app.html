{% extends "base.html" %}
{% block content %}

<div class="drawer-overlay" id="drawerOverlay"></div>

<aside class="drawer" id="drawer">
  <div class="flex items-center gap-2 px-5 pt-6 pb-5">
    <div class="w-8 h-8 rounded-lg flex items-center justify-center" style="background:linear-gradient(135deg, var(--accent-turf), var(--accent-turf-dim));">
      <span class="font-display font-700 text-sm text-[#04160B]">P</span>
    </div>
    <span class="font-display font-700 text-lg tracking-wide">PELADA<span style="color:var(--accent-turf)">STATS</span></span>
  </div>

  <nav class="flex-1 flex flex-col gap-0.5 mt-1">
    <a href="{{ url_for('dashboard.home') }}" class="drawer-link {{ 'active' if request.endpoint == 'dashboard.home' }}">📊 Dashboard</a>
    <a href="{{ url_for('matches.lista') }}" class="drawer-link {{ 'active' if request.endpoint and request.endpoint.startswith('matches.') }}">⚽ Jogos</a>
    <a href="{{ url_for('profile.me') }}" class="drawer-link {{ 'active' if request.endpoint and request.endpoint.startswith('profile.') }}">🧑 Perfil</a>
    <a href="{{ url_for('records.lista') }}" class="drawer-link {{ 'active' if request.endpoint == 'records.lista' }}">🏆 Recordes</a>
    <a href="{{ url_for('comparar.head_to_head') }}" class="drawer-link {{ 'active' if request.endpoint == 'comparar.head_to_head' }}">⚔️ Comparar</a>
    <a href="{{ url_for('settings.definicoes') }}" class="drawer-link {{ 'active' if request.endpoint == 'settings.definicoes' }}">⚙️ Definições</a>
  </nav>

  <div class="px-2 pb-6 pt-2" style="border-top:1px solid var(--border-glass);">
    <a href="{{ url_for('auth.logout') }}" class="drawer-link" style="color:var(--accent-danger)">⏻ Sair</a>
  </div>
</aside>

<div class="max-w-md mx-auto min-h-screen flex flex-col pb-10">

  <header class="topbar flex items-center justify-between px-5 py-3.5 sticky top-0 z-30">
    <button class="icon-btn" id="openDrawer" aria-label="Abrir menu">☰</button>
    <span class="section-title">{% block page_title %}{% endblock %}</span>
    <span class="text-xs font-600" style="color:var(--text-muted)">{{ current_user.nickname }}</span>
  </header>

  <main class="flex-1">
    {% block app_content %}{% endblock %}
  </main>

</div>

<script>
  const drawer = document.getElementById('drawer');
  const overlay = document.getElementById('drawerOverlay');
  document.getElementById('openDrawer').addEventListener('click', ()=>{
    drawer.classList.add('open'); overlay.classList.add('open');
  });
  overlay.addEventListener('click', ()=>{
    drawer.classList.remove('open'); overlay.classList.remove('open');
  });
</script>

{% endblock %}
