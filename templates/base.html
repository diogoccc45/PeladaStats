<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}PeladaStats{% endblock %}</title>

<!-- Add to Home Screen (iOS Safari) / PWA install support -->
<link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/apple-touch-icon.png') }}">
<link rel="icon" href="{{ url_for('static', filename='icons/icon-192.png') }}">
<link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PeladaStats">
<meta name="theme-color" content="#0A0E17">

<script>
  // Aplica o tema guardado antes do primeiro render, para não haver flash da cor errada.
  (function(){
    var saved = localStorage.getItem('peladastats-theme');
    if(saved === 'light'){ document.documentElement.setAttribute('data-theme', 'light'); }
  })();
</script>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}?v=15">
</head>
<body class="min-h-screen">

{% with messages = get_flashed_messages() %}
  {% if messages %}
    <div class="max-w-md mx-auto px-5 pt-4 flex flex-col gap-2">
      {% for msg in messages %}
        <div class="flash rounded-lg px-3.5 py-2.5">{{ msg }}</div>
      {% endfor %}
    </div>
  {% endif %}
{% endwith %}

{% block content %}{% endblock %}

</body>
</html>
